name: Tests

on:
  workflow_call:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # The 3.9 pin that kept this on ubuntu-24.04 is gone with the floor, so this
    # follows ubuntu-latest again.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Dockerfile ships and the floor in pyproject.toml.
        # 3.13 catches standard-library removals before a release does - it is
        # how the imghdr breakage in the image proxy was found.
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Show resolved versions
        # tests/requirements.txt is unpinned, so recording what was actually
        # installed makes a version-specific failure legible.
        run: pip list

      - name: Run test suites
        run: python tests/run_all.py

  # The check branch protection should require, rather than the matrix jobs
  # themselves. Those are named after the Python version they run, so every
  # version bump renames them and silently invalidates the required-check list:
  # the old name can never report again, and a fully green pull request blocks
  # forever on a check that no longer exists. That is exactly what the 3.9 ->
  # 3.12 bump did. This name does not move when the matrix does.
  tests-passed:
    name: Tests
    # Branch protection only requires "Tests" and "Ruff". Folding the other
    # gates in here means a failing contract or Docker build cannot be merged
    # by automerge just because the Python matrix happened to pass - which is
    # how the nuxt 4 bump landed with an out-of-sync package-lock.json.
    needs: [test, lint, openapi-contract]
    # always(), so a failed, cancelled or skipped job still reports a result
    # here. A required check that is skipped never reports at all, which blocks
    # a pull request the same way a renamed one does.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gated job to have passed
        # needs.test.result is the aggregate over the whole matrix: 'success'
        # only when every leg succeeded.
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          echo "ruff result: ${{ needs.lint.result }}"
          echo "openapi contract result: ${{ needs['openapi-contract'].result }}"
          [ "${{ needs.test.result }}" = "success" ]
          [ "${{ needs.lint.result }}" = "success" ]
          [ "${{ needs['openapi-contract'].result }}" = "success" ]

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # Version matches pyproject.toml and .pre-commit-config.yaml so local and
      # CI evaluate the same rules.
      - name: Install ruff
        run: pip install ruff==0.6.7

      # Enforcing. Pre-existing findings are baselined explicitly in
      # pyproject.toml ([tool.ruff.lint.per-file-ignores]); only new findings
      # fail the build.
      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  # Regenerates types/api.ts from the backend OpenAPI schema and fails if it
  # differs from what is committed, so a schema change without a regenerated
  # contract is caught in review rather than at runtime.
  openapi-contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: listsync-nuxt/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # The generator imports the FastAPI app bootless, so it needs the same
      # backend dependencies the suites use (seleniumbase/bs4/halo are stubbed).
      - name: Install schema export dependencies
        run: pip install -r tests/requirements.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: listsync-nuxt

      - name: Regenerate the API contract
        run: npm run openapi
        working-directory: listsync-nuxt

      - name: Fail on drift
        run: git diff --exit-code -- types/api.ts
        working-directory: listsync-nuxt
