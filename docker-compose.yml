# Full deployment from the published image (ghcr.io/woahai321/list-sync:main).
# Mode: full web UI + API + core sync, no local build.
#   Run:  docker compose up -d
# Local source build of the same mode: docker-compose.local.yml
# Core-only (no web UI/API):        docker-compose.core.yml
services:
  listsync-full:
    image: ghcr.io/woahai321/list-sync:main
    container_name: listsync-full
    ports:
      # Frontend (Nuxt 3 Dashboard) 
      - "3222:3222"
      # Backend API (FastAPI)
      - "4222:4222"
    environment:
      # Timezone Configuration (set to Europe/London for BST/GMT, change as needed)
      # Timezone - Supports: IANA names (Europe/Paris), abbreviations (CET), offsets (UTC+1, GMT-5)
      - TZ=${TZ:-UTC}
      
      # Overseerr Configuration 
      - OVERSEERR_URL=${OVERSEERR_URL:-}
      - OVERSEERR_API_KEY=${OVERSEERR_API_KEY:-}
      - OVERSEERR_USER_ID=${OVERSEERR_USER_ID:-1}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-24}
      - AUTOMATED_MODE=true
      - OVERSEERR_4K=${OVERSEERR_4K:-false}
      
      # List Configuration (comma-separated)
      - IMDB_LISTS=${IMDB_LISTS:-}
      - TRAKT_LISTS=${TRAKT_LISTS:-}
      - LETTERBOXD_LISTS=${LETTERBOXD_LISTS:-}
      - ANILIST_LISTS=${ANILIST_LISTS:-}
      - MDBLIST_LISTS=${MDBLIST_LISTS:-}
      - STEVENLU_LISTS=${STEVENLU_LISTS:-}
      - TRAKT_SPECIAL_LISTS=${TRAKT_SPECIAL_LISTS:-}
      - TRAKT_SPECIAL_ITEMS_LIMIT=${TRAKT_SPECIAL_ITEMS_LIMIT:-}
      
      # Trakt API Configuration
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-}

      # Internal API URL for frontend (Nuxt Nitro proxy handles /api internally)
      # Browser traffic is proxied same-origin by Nuxt; no backend URL needed.
      - NUXT_PUBLIC_API_URL=
      # Optional shared secret. Nuxt injects it server-side; the browser never sees it.
      - LISTS_SYNC_API_TOKEN=${LISTS_SYNC_API_TOKEN:-}
      - LISTS_SYNC_API_URL=http://127.0.0.1:4222

      # Optional native OIDC login. Nginx Proxy Manager's Authelia
      # forward-auth remains the external gate; these values enable login for
      # direct/internal access and authorise the forward-auth identity.
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_CLIENT_SECRET_FILE=${OIDC_CLIENT_SECRET_FILE:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid email profile groups}
      - OIDC_ALLOWED_EMAILS=${OIDC_ALLOWED_EMAILS:-}
      - OIDC_SESSION_HOURS=${OIDC_SESSION_HOURS:-8}
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:-}
      
      # Docker-specific settings
      - RUNNING_IN_DOCKER=true
      - NO_SANDBOX=1
      - DISPLAY=:99
    volumes:
      # Persist data directory
      - ./data:/usr/src/app/data
      # Mount environment file
      - ./.env:/usr/src/app/.env
      # Optional: Mount logs for debugging
      - ./logs:/var/log/supervisor
    restart: unless-stopped 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4222/api/system/health", "&&", "curl", "-f", "http://localhost:3222"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Note: Complete ListSync application with:
    # - Core sync service (python -m list_sync)
    # - FastAPI backend (port 4222)
    # - Nuxt 3 frontend (port 3222)
    # All managed by supervisor for reliability 