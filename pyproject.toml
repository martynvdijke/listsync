[tool.poetry]
name = "list-sync"
version = "1.1.1"
description = "Sync your watchlists from IMDb, Trakt, and Letterboxd with Overseerr/Jellyseerr"
authors = ["Soluify"]
# The file on disk is ReadMe.md; on a case-sensitive filesystem "README.md"
# does not resolve, which `poetry build` and `poetry check` both reject.
readme = "ReadMe.md"
packages = [{include = "list_sync"}]

[tool.poetry.scripts]
list-sync = "list_sync.main:main"

[tool.poetry.dependencies]
# 3.9 reached end of life in October 2025 and 3.10 in October 2026, so neither
# receives interpreter security fixes any more. The floor also decides how far
# the dependencies can move: cryptography from 44.0.0 on excludes 3.9.0/3.9.1,
# and fastapi from 0.129 on requires 3.10, so a 3.9 floor pinned the whole
# stack to releases that are years behind.
python = ">=3.12,<4.0"
requests = ">=2.32.4"
seleniumbase = ">=4.18.1"
cryptography = ">=44.0.1"
colorama = ">=0.4.6"
python-dotenv = ">=1.0.0"
discord-webhook = ">=1.3.0"
halo = ">=0.0.31"

[tool.poetry.group.dev.dependencies]
# One ruff version for the dev dependency, CI (.github/workflows/ci.yml) and
# pre-commit (.pre-commit-config.yaml). Bumping it is a deliberate, separate
# change: a different ruff evaluates different rules, so the pinned version is
# what makes "enabled" mean the same thing everywhere.
ruff = "0.6.7"

# The FastAPI backend's own dependencies. Kept in a separate group so the
# core-only image (`poetry install --only main`, see Dockerfile.core) does not
# carry a web server it never starts. The full image installs
# `--only main,api` (see Dockerfile); a local checkout uses
# `poetry install --only main,api` as well.
[tool.poetry.group.api]
optional = true

[tool.poetry.group.api.dependencies]
# fastapi 0.115.3 is the first release requiring starlette >= 0.40, where the
# unbounded multipart parsing (CVE-2024-47874) was fixed. Floors only - the
# lockfile decides the version.
fastapi = ">=0.115.3"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
pydantic = ">=2.9.0"
psutil = ">=5.9.0"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "TD", "FIX", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
# COM812 and ISC001 conflict with `ruff format` (ruff itself warns about this):
# the formatter owns trailing commas and import grouping, so leaving these on
# would make check and format disagree. This is the only rule reduction, and it
# is a documented consequence of adopting the formatter.
ignore = ["S101", "T201", "T203", "PLR0913", "PLR0915", "S603", "S607", "FBT002", "FBT001", "N802", "N803", "N806", "N815", "PLR2004", "SIM108", "SIM105", "PTH123", "ARG002", "PLR0912", "C901", "PLR0911", "PGH003", "COM812", "ISC001"]
# Baseline of pre-existing findings, recorded 2026-09-15 alongside the first
# enforcing CI run (ruff 0.6.7). These are findings the first pass did not fix:
# type-checking/style judgements and rules later changes (error handling, data
# layer) are expected to drive down. This list is a debt ledger: it may only
# shrink. Adding an entry is an explicit, reviewable decision.
[tool.ruff.lint.per-file-ignores]
